# SV1 Configuration: Stage 1-1 Training (Giai đoạn 2: Huấn luyện 1-1, 21/11 - 25/11)
# Assigned to: SV1

experiment:
  name: "sv1_stage1_1_run"
  author: "SV1"
  seed: 101
  device: "cuda"

env:
  env_id: "SuperMarioBros-1-1-v0"
  action_type: "simple"
  skip_frames: 4
  img_size: [84, 84]
  shaped_reward: true
  reward_kwargs:
    progress_weight: 1.2
    death_penalty: -20.0
    flag_bonus: 100.0
    time_penalty: -0.1

ppo:
  total_timesteps: 5000000
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  lr: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  value_coef: 0.5
  entropy_coef: 0.015 # Slightly higher exploration
  max_grad_norm: 0.5

evaluation:
  eval_interval_steps: 50000
  num_eval_episodes: 10

output:
  checkpoint_dir: "checkpoints"
  log_dir: "logs/sv1"
  eval_dir: "eval_results/sv1"
