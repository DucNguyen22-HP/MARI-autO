# Base PPO Training Configuration
# Shared default parameters across the group

experiment:
  name: "mario_ppo_base"
  seed: 42
  device: "cuda" # or "cpu"

env:
  env_id: "SuperMarioBros-1-1-v0"
  action_type: "simple" # simple, right_only, complex
  skip_frames: 4
  img_size: [84, 84]
  shaped_reward: true
  reward_kwargs:
    progress_weight: 1.0
    death_penalty: -15.0
    flag_bonus: 50.0
    time_penalty: -0.1

ppo:
  total_timesteps: 5000000
  n_steps: 2048 # Steps collected per rollout
  batch_size: 64 # Minibatch size
  n_epochs: 10 # PPO update epochs
  lr: 0.00025
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5

evaluation:
  eval_interval_steps: 100000
  num_eval_episodes: 10
  save_best_only: true
  render_video: false

output:
  checkpoint_dir: "checkpoints"
  log_dir: "logs"
  eval_dir: "eval_results"
