# SV3 Configuration: Baseline with Second Seed (Giai đoạn 3: Máy 3 SV3, 25/11 - 30/11)
# Experiment: Seed 2 baseline verification against SV2's ablation

experiment:
  name: "sv3_baseline_seed_2"
  author: "SV3"
  seed: 84 # Distinct second seed
  device: "cuda"

env:
  env_id: "SuperMarioBros-1-1-v0"
  action_type: "simple"
  skip_frames: 4
  img_size: [84, 84]
  shaped_reward: true
  reward_kwargs:
    progress_weight: 1.0
    death_penalty: -15.0
    flag_bonus: 50.0
    time_penalty: -0.1

ppo:
  total_timesteps: 5000000
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  lr: 0.00025
  gamma: 0.99 # Standard baseline gamma
  gae_lambda: 0.95
  clip_ratio: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5

evaluation:
  eval_interval_steps: 100000
  num_eval_episodes: 10

output:
  checkpoint_dir: "checkpoints"
  log_dir: "logs/sv3_seed2"
  eval_dir: "eval_results/sv3_seed2"
