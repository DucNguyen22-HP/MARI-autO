# Cấu hình chạy đối chứng Seed 2 của SV3 (Giai đoạn 3: Máy 3 SV3)
# Giữ nguyên cấu hình gốc nhưng đổi seed=2 để đối chiếu thống kê
level: "1-1"
seed: 2
device: auto
run_dir: "runs/1-1/sv3_seed2_baseline"
resume: null
torch_threads: 2
checkpoint_every: 500_000
eval_episodes: 5
eval_max_steps: 3000
video: true

env:
  actions: simple
  frame_skip: 4
  frame_stack: 4
  size: 84
  # [x_pos, time, death, coin, enemy]
  weights: [1.0, 1.0, 2.0, 0.05, 0.05]
  noop_max: 30
  normalize_reward: true

model: {}

algo:
  num_envs: 16
  num_steps: 256
  num_minibatches: 8
  update_epochs: 4
  total_steps: 5_000_000
  lr: 2.5e-4
  anneal_lr: true
  adam_eps: 1e-5
  gamma: 0.9 # Giữ nguyên baseline 0.90
  gae_lambda: 0.95
  clip_coef: 0.2
  clip_vloss: false
  norm_adv: true
  ent_coef: 0.01
  vf_coef: 0.25
  max_grad_norm: 0.5
  target_kl: null
