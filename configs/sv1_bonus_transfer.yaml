# SV1 Configuration: Transfer Learning for Bonus Stage (Giai đoạn 3: Màn thưởng, 25/11 - 30/11)
# Machine 1 (SV1): Initialized from best 1-1 checkpoint

experiment:
  name: "sv1_bonus_stage_transfer"
  author: "SV1"
  seed: 101
  device: "cuda"
  pretrained_checkpoint: "checkpoints/best_1-1.pt" # Transfer learning checkpoint

env:
  env_id: "SuperMarioBros-1-2-v0" # Bonus stage (e.g., 1-2 or 3-1)
  action_type: "simple"
  skip_frames: 4
  img_size: [84, 84]
  shaped_reward: true
  reward_kwargs:
    progress_weight: 1.0
    death_penalty: -25.0
    flag_bonus: 100.0
    time_penalty: -0.15

ppo:
  total_timesteps: 3000000
  n_steps: 2048
  batch_size: 64
  n_epochs: 8
  lr: 0.0001 # Lower learning rate for fine-tuning
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5

evaluation:
  eval_interval_steps: 50000
  num_eval_episodes: 10

output:
  checkpoint_dir: "checkpoints"
  log_dir: "logs/sv1_bonus"
  eval_dir: "eval_results/sv1_bonus"
